name: Publish
on:
  push:
    branches: main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          yarn setup

      - name: Build step
        run: |
          yarn build

      # Library installs (PLUG.md) read the built files from the repo, so commit them back.
      # Pushes made with GITHUB_TOKEN don't re-trigger this workflow.
      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excalidraw.plug.js Silverbullet-Excalidraw/excalidraw_editor.js
          git diff --cached --quiet || git commit -m "build: update compiled plug [skip ci]"
          git push

      - name: Update release tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: "edge"
          force_push_tag: true

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          tag_name: edge
          body: Automated build from commit ${{ github.sha }}
          files: |
            excalidraw.plug.js
            editor/dist/excalidraw_editor.js
